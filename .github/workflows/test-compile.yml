# Smoke check: the test code must still compile.
#
# The failure this exists to catch (2026-07-06): the full-workspace `cargo test`
# did not compile at all — missing `tempfile` dev-deps, a stale `ChannelId`
# import, test initializers referencing fields that had been removed, and a
# `DaemonConfig` field omission that was a *production* build break. None of it
# was noticed, because nothing ran the tests on a schedule anyone watched.
#
# `--no-run` builds every test target without executing it: it catches drift
# cheaply and cannot fail for flaky-runtime reasons, which is what makes it a
# smoke check rather than a test suite.
name: test-compile

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: test-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-tests:
    # Windows on purpose: it is the platform this workspace is developed and
    # pinned against (MSVC toolchain, `aegis` on the pure-Rust path, the
    # `windows-service` integration). A Linux runner would not exercise the
    # `#[cfg(windows)]` code, which is where the service layer lives.
    runs-on: windows-latest
    # Measured: 16m12s on the first run, with a completely cold cache
    # (run 29557077493). 30 gives ~2x headroom for a dependency bump that
    # invalidates everything, while still killing a hang in reasonable time.
    # Re-measure if the graph grows; do not raise it to paper over a hang.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain reads its `toolchain` input, not
      # rust-toolchain.toml, so the pinned channel is passed explicitly rather
      # than `@nightly`. Keep it in lockstep with rust-toolchain.toml — that
      # file carries the pin's rationale and the condition for removing it.
      # (The channel below is nightly-2026-08-27; an earlier version of this
      # comment still named the superseded nightly-2026-07-13 pin.)
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Distinguish this job's cache from any future workflow's.
          key: test-compile

      # `nanna-gui` is excluded deliberately, not out of convenience: its
      # build.rs needs two artifacts the repo does not commit — the Tauri sidecar
      # binary (`gui/src-tauri/binaries/nanna-daemon-<triple>.exe`) and the built
      # frontend at `gui/.output/public`. Building it here would mean running the
      # full pnpm + daemon build, which is a packaging job, not a smoke check.
      - name: Compile all test targets
        run: cargo test --no-run --workspace --exclude nanna-gui --locked

  # `nanna-gui` is excluded above, so until this job existed **nothing in CI
  # compiled it at all** — and `gui.yml` only triggers on `gui/**` paths, so a
  # change under `crates/` that broke `gui/src-tauri/src/**` reached neither
  # workflow's Rust coverage.
  #
  # That is not hypothetical. On 2026-08-23 `nanna-gui` was found broken on this
  # branch: adding `webhook_secret` to `TelegramConfig`/`SignalConfig` in
  # `nanna-config` updated three of the four construction sites, and the fourth
  # (`gui/src-tauri/src/commands/channels.rs`) failed with two E0063s. Every
  # existing gate was green, because every existing gate skips this crate.
  #
  # The exclusion above cites a real obstacle — `nanna-gui`'s build needs two
  # artifacts the repo does not commit — but both can be **stubbed**, which is
  # what makes this job cheap. Measured locally: a 4-byte placeholder sidecar
  # and a one-line `index.html` are enough for `cargo check -p nanna-gui` to run
  # the real typecheck. No `pnpm build`, no daemon build.
  check-gui:
    name: Typecheck nanna-gui
    runs-on: windows-latest
    # Measured at 55s for the check itself once the shared dependency graph is
    # built; that graph dominates, so this matches the job above's bound for it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-gui

      # Stubs, deliberately: this job typechecks Rust, it does not package an
      # app. The sidecar only has to exist for Tauri's externalBin resolution,
      # and `frontendDist` only has to be a directory for `generate_context!`
      # not to panic. Packaging is `release.yml`'s job, with the real artifacts.
      - name: Stub the two uncommitted build artifacts
        shell: bash
        run: |
          mkdir -p gui/src-tauri/binaries gui/.output/public
          printf 'stub' > gui/src-tauri/binaries/nanna-daemon-x86_64-pc-windows-msvc.exe
          printf '<!doctype html><title>stub</title>' > gui/.output/public/index.html

      - name: Typecheck the GUI crate
        run: cargo check --package nanna-gui --locked
