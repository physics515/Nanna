version: 2
updates:
  # Rust workspace
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    ignore:
      # Pre-1.0 pins we deliberately hold (see ROADMAP dep notes).
      - dependency-name: turso
      - dependency-name: aegis

  # GUI / Tauri frontend
  - package-ecosystem: npm
    directory: "/gui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript"]
    # Major bumps of these need a real migration — do not auto-PR them.
    ignore:
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: vue-router
        update-types: ["version-update:semver-major"]
      - dependency-name: vue-sonner
        update-types: ["version-update:semver-major"]
      - dependency-name: marked
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: lucide-vue-next

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]

  # Group updates for non-critical dependencies
  - package-ecosystem: cargo
    directory: "/"
    groups:
      dev-dependencies:
        patterns:
          - "*test*"
          - "*dev*"
        update-types: "minor"
    schedule:
      interval: monthly
    labels: ["dependencies", "rust"]

  # Group updates for npm dev dependencies
  - package-ecosystem: npm
    directory: "/gui"
    groups:
      dev-dependencies:
        patterns:
          - "*dev*"
          - "*test*"
        update-types: "minor"
    schedule:
      interval: monthly
    labels: ["dependencies", "javascript"]

  # Security updates (critical)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust", "security"]
    ignore:
      - dependency-name: turso
        update-types: ["version-update:semver-major"]
      - dependency-name: aegis
        update-types: ["version-update:semver-major"]

  # Security updates for npm
  - package-ecosystem: npm
    directory: "/gui"
    schedule:
      interval: daily
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript", "security"]

  # Security updates for GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci", "security"]
