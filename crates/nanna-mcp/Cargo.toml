[package]
name = "nanna-mcp"
version.workspace = true
edition.workspace = true
description = "MCP (Model Context Protocol) client for Nanna"

[features]
default = ["stdio", "http", "tools-integration"]
stdio = ["tokio/process"]
# SSE over reqwest. `tokio-tungstenite` used to be here for a WebSocket
# transport that was never written, and no file ever imported it.
http = ["reqwest"]
tools-integration = ["nanna-tools"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# HTTP transport (optional)
reqwest = { workspace = true, optional = true }

# For stdio line reading
futures = "0.3"

# JSON-RPC
uuid.workspace = true

# Tools integration (optional)
nanna-tools = { path = "../nanna-tools", optional = true }
