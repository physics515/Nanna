# Pinned to a nightly VERIFIED to compile this workspace in the *release* profile.
#
# History of why a pin exists at all (both failures are release-codegen/const-eval only;
# debug builds, tests and clippy are unaffected by either):
#
# - nightly 2026-07-23 (89c61a754) ICEd in rustc_codegen_ssa compiling `tokio` under our
#   release profile (`lto = "fat"`, `codegen-units = 1`, `panic = "abort"`), which forced
#   the previous pin nightly-2026-07-13.
# - nightly-2026-07-13 in turn FAILS release builds as of 2026-08-14: recompiling
#   `turso_core 0.6.1` (forced by a dependency-freshness pass) hits "queries overflow the
#   depth limit" simplifying a `from_repr` discriminant constant. The failure was latent
#   while a cached rlib existed, so "the pin built fine yesterday" proves nothing after
#   any bump that dirties turso_core.
#
# This channel (rustc 1.100.0-nightly, commit e7769602a) builds `cargo build --release
# -p nanna-daemon` green — verified in 18m55s on 2026-08-26 — with no tokio ICE and no
# turso depth overflow. It does surface one NEW future-incompatible warning that the
# previous pin did not: `recursion_depth_exceeding_limit` (rust#159228), raised while
# proving the daemon's scheduler closure is `Send` through wgpu's type graph. That is
# answered where it belongs, by `#![recursion_limit = "256"]` on the daemon crate roots
# — not by staying on an older nightly.
#
# On each dependency-freshness pass: try the current nightly with a full
# `cargo build --release -p nanna-daemon`; if green, move this pin (and the mirrored
# `toolchain:` inputs in .github/workflows/{budget-gate,release-check,test-compile}.yml —
# release-check was missing from this list until 2026-08-26) forward to it.
[toolchain]
channel = "nightly-2026-08-25"
components = ["rustfmt", "clippy"]
