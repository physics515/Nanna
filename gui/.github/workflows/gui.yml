name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  frontend-ci:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint check (ESLint)
        run: pnpm exec eslint app/ src/
      
      - name: Format check (Prettier)
        run: pnpm exec prettier --check app/ src/
      
      - name: Type check (vue-tsc)
        run: pnpm exec vue-tsc --noEmit
      
      - name: Security audit
        run: pnpm audit
      
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: './'
          exclude: 'node_modules|.git|.nuxt|.output|dist'
          base: ''
          head: HEAD
          only-verified: false
      
      - name: Run tests (Vitest)
        run: pnpm test
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./test-results/coverage/*.json
          fail_ci_if_error: false
      
      - name: Build smoke test
        run: pnpm run build
      
      - name: Tauri build smoke test
        run: pnpm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
      
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanna-windows-x86_64
          path: gui/src-tauri/target/release/bundle/*/nanna_*
